function chColor(c){ var i=D.channels.indexOf(c); return "var("+CHV[i<0?0:i%CHV.length]+")"; }

/* ---------- charts (plain SVG, sized to the real container so text stays legible) ---------- */
function niceStep(r,cnt){ var raw=r/cnt; var p=Math.pow(10,Math.floor(Math.log10(raw||1))); var m=raw/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
function chartW(){ return Math.max(290,Math.min(1000,(app.clientWidth||900)-46)); }

function barChart(o){
  var W=o.W||chartW(), H=o.H||250, L=52, R=10, T=20, B=30;
  var vals=[]; o.a.concat(o.b).forEach(function(v){ if(typeof v==="number") vals.push(v); });
  var lo=Math.min(0,Math.min.apply(null,vals.length?vals:[0])), hi=Math.max(0,Math.max.apply(null,vals.length?vals:[1]));
  if(hi===lo) hi=lo+1;
  var st=niceStep(hi-lo,4); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  var y=function(v){ return T+(hi-v)/(hi-lo)*(H-T-B); };
  var n=o.labels.length, gw=(W-L-R)/n, bw=Math.max(3,Math.min(28,(gw-8)/2));
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
  for(var t=lo;t<=hi+st/2;t+=st){ s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text class="axt" x="'+(L-7)+'" y="'+(y(t)+3.5)+'" text-anchor="end">'+esc(o.axis(t))+'</text>'; }
  s+='<line class="zl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  var showV=bw>=17;
  for(var i=0;i<n;i++){
    var cx=L+gw*i+gw/2;
    [[o.a[i],cx-bw-1,o.ca,o.na],[o.b[i],cx+1,o.cb,o.nb]].forEach(function(p){
      var v=p[0];
      if(v==="nb"){ s+='<text class="vt" x="'+(p[1]+bw/2)+'" y="'+(y(0)-4)+'" text-anchor="middle">n/a</text>'; return; }
      if(typeof v!=="number") return;
      var y0=y(Math.max(0,v)), h=Math.max(1,Math.abs(y(v)-y(0)));
      s+='<rect x="'+p[1]+'" y="'+y0+'" width="'+bw+'" height="'+h+'" rx="2" style="fill:'+p[2]+'"><title>'+esc(p[3]+" "+o.labels[i]+": "+o.fmt(v))+'</title></rect>';
      if(showV) s+='<text class="vt" x="'+(p[1]+bw/2)+'" y="'+(v>=0?y0-4:y0+h+11)+'" text-anchor="middle">'+esc(o.lab(v))+'</text>';
    });
    s+='<text class="axt" x="'+cx+'" y="'+(H-B+16)+'" text-anchor="middle">'+esc(o.labels[i])+'</text>';
  }
  return s+'</svg>';
}

function lineChart(o){
  var maxLab=0; if(o.endLabels) o.lines.forEach(function(l){ if(l.label) maxLab=Math.max(maxLab,l.label.length); });
  var W=o.W||chartW(), H=o.H||300, L=54, R=maxLab?Math.min(190,maxLab*6.4+16):14, T=16, B=30;
  var vals=[]; o.lines.forEach(function(l){ l.v.forEach(function(v){ if(typeof v==="number"&&(!o.log||v>0)) vals.push(v); }); });
  if(!vals.length) return '<div class="empty">No data for this selection.</div>';
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), ticks=[], y;
  if(o.log){
    var a=Math.floor(Math.log10(lo)), b=Math.ceil(Math.log10(hi)); if(a===b) b++;
    for(var d=a;d<=b;d++){ [1,2,5].forEach(function(m){ var t=m*Math.pow(10,d); if(t>=Math.pow(10,a)&&t<=Math.pow(10,b)) ticks.push(t); }); }
    var la=a,lb=b; y=function(v){ return T+(lb-Math.log10(v))/(lb-la)*(H-T-B); };
  } else {
    var pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad; var st=niceStep(hi-lo,5); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
    for(var t=lo;t<=hi+st/2;t+=st) ticks.push(t);
    y=function(v){ return T+(hi-v)/(hi-lo)*(H-T-B); };
  }
  var n=o.x.length, x=function(i){ return L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)); };
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
  ticks.forEach(function(t){ s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text class="axt" x="'+(L-7)+'" y="'+(y(t)+3.5)+'" text-anchor="end">'+esc(o.axis(t))+'</text>'; });
  for(var i=0;i<n;i++) s+='<text class="axt" x="'+x(i)+'" y="'+(H-B+16)+'" text-anchor="middle">'+esc(o.x[i])+'</text>';
  var ends=[];
  o.lines.forEach(function(l){
    var d="",last=null;
    l.v.forEach(function(v,i){ if(typeof v!=="number"||(o.log&&v<=0)) return; d+=(d?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); last={i:i,v:v}; });
    if(!d) return;
    s+='<path d="'+d+'" fill="none" style="stroke:'+l.color+'" stroke-width="'+(l.dash?1.6:2.6)+'"'+(l.dash?' stroke-dasharray="5 4"':'')+' stroke-linejoin="round" stroke-linecap="round"><title>'+esc(l.name)+'</title></path>';
    l.v.forEach(function(v,i){ if(typeof v!=="number"||(o.log&&v<=0)) return; s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(l.dash?2:2.8)+'" style="fill:'+l.color+'"><title>'+esc(l.name+", "+o.x[i]+": "+o.fmt(v))+'</title></circle>'; });
    if(o.endLabels&&last) ends.push({y:y(last.v),x:x(last.i),t:l.label,c:l.color});
  });
  ends.sort(function(p,q){return p.y-q.y;});
  for(var k=1;k<ends.length;k++){ if(ends[k].y-ends[k-1].y<13) ends[k].y=ends[k-1].y+13; }
  var over=ends.length?ends[ends.length-1].y-(H-B):0;             // keep labels inside the plot
  if(over>0){ for(var q=ends.length-1;q>=0;q--){ ends[q].y-=over; if(q>0&&ends[q].y-ends[q-1].y>=13) break; if(q>0) over=ends[q-1].y-(ends[q].y-13); if(over<=0) break; } }
  ends.forEach(function(e){ s+='<text class="el" x="'+(e.x+8)+'" y="'+(e.y+3.5)+'" style="fill:'+e.c+'">'+esc(e.t)+'</text>'; });
  return s+'</svg>';
}

function hBars(o){
  var W=o.W||chartW(), rowH=40, L=Math.min(170,W*0.34), R=76, T=6, H=T+o.items.length*rowH+6;
  var vals=o.items.map(function(it){return it.v;}).filter(function(v){return typeof v==="number";});
  var lo=Math.min(0,Math.min.apply(null,vals)), hi=Math.max(0,Math.max.apply(null,vals)); if(hi===lo) hi=lo+1;
  var x=function(v){ return L+(v-lo)/(hi-lo)*(W-L-R); };
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
  s+='<line class="zl" x1="'+x(0)+'" x2="'+x(0)+'" y1="'+T+'" y2="'+(H-4)+'"/>';
  o.items.forEach(function(it,i){
    var cy=T+i*rowH+rowH/2;
    s+='<text class="axt" x="'+(L-10)+'" y="'+(cy+4)+'" text-anchor="end" style="font-size:12px;fill:var(--ink)">'+esc(it.name)+'</text>';
    if(typeof it.v!=="number") return;
    var x0=x(Math.min(0,it.v)), w=Math.max(2,Math.abs(x(it.v)-x(0)));
    s+='<rect x="'+x0+'" y="'+(cy-11)+'" width="'+w+'" height="22" rx="3" style="fill:'+it.c+'"><title>'+esc(it.name+": "+o.fmt(it.v))+'</title></rect>';
    s+='<text x="'+(x(Math.max(0,it.v))+8)+'" y="'+(cy+4)+'" style="font-size:12.5px;font-weight:650;fill:var(--ink);font-family:Inter,sans-serif">'+esc(o.fmt(it.v))+'</text>';
  });
  return s+'</svg>';
}

/* ---------- sections ---------- */
function kpi(k,v,d,c){ return '<div class="kpi"><div class="k">'+k+'</div><div class="v'+(c?" "+c:"")+'">'+v+'</div>'+(d?'<div class="d">'+d+'</div>':'')+'</div>'; }
function legendYears(){ return '<div class="legend"><span><i class="sw" style="background:var(--ya)"></i>'+esc(S.yA)+'</span><span><i class="sw" style="background:var(--yb)"></i>'+esc(S.yB)+'</span></div>'; }
function seg(act,opts,cur){ return '<div class="seg" role="group">'+opts.map(function(o){ return '<button data-act="'+act+'" data-v="'+esc(o[0])+'" aria-pressed="'+(o[0]===cur)+'">'+esc(o[1])+'</button>'; }).join("")+'</div>'; }
function comps(){ return (D.competitors&&D.competitors[S.yB])||null; }

function headline(n){
  var p=chPeriod(S.yB,OWN,n), q=chPeriod(S.yA,OWN,n);
  if(!p||p.net===null) return "";
  var c=chg(q&&q.net,p.net), dir="";
  if(typeof c==="number") dir=", "+Math.abs(c).toFixed(0)+"% "+(c<0?"fewer":"more")+" than the same months of "+S.yA;
  var ew=wins(function(i){return num(eng(S.yA,OWN)[i]);},function(i){return num(eng(S.yB,OWN)[i]);},n);
  var s=(n===1?"In January ":"From January to "+FULL[n-1]+" ")+S.yB+", "+OWN+" added <strong>"+fi(p.net)+" followers</strong>"+dir+".";
  if(ew.t){
    if(ew.w===0) s+=" Its engagement rate was lower than the same month of "+S.yA+" in <strong>every month</strong>.";
    else if(ew.w===ew.t) s+=" Its engagement rate beat the same month of "+S.yA+" in <strong>every month</strong>.";
    else s+=" Its engagement rate beat the same month of "+S.yA+" in <strong>"+ew.w+" of "+ew.t+" months</strong>.";
  }
  return s;
}

function overview(n){
  var C=comps(), rivals=C?C.pages.join(" and "):"key competitors";
  return '<section class="sec" id="overview"><div class="obj">'+
    '<div><h3>What this report covers</h3><ul>'+
      '<li>How each IPASS social channel\'s audience grew in '+esc(S.yB)+', compared with the same months of '+esc(S.yA)+'.</li>'+
      '<li>Whether engagement on each channel improved or declined year over year.</li>'+
      '<li>A focused view of '+esc(OWN)+', the primary channel being monitored.</li>'+
      '<li>How '+esc(OWN)+'\'s '+esc(S.yB)+' audience growth compares with '+esc(rivals)+'.</li>'+
    '</ul></div>'+
    '<div><h3>How to read it</h3><ul>'+
      '<li>Both years are measured over the same months, '+range(n)+', so neither year looks bigger simply by having more months.</li>'+
      '<li>Engagement rates are shown exactly as reported by each platform. They aren\'t averaged, and since every platform calculates them differently, channels aren\'t ranked against each other on engagement.</li>'+
      '<li>Follower growth is recalculated from follower counts, starting from the December before each year. Where a December count wasn\'t recorded, it was worked out from the January growth rate in the source data.</li>'+
    '</ul></div></div>'+
    (D.note?'<div class="flag">'+esc(D.note)+'</div>':'')+
  '</section>';
}

function mainSection(n){
  var p=chPeriod(S.yB,OWN,n), q=chPeriod(S.yA,OWN,n);
  var yoy=chg(num(fol(S.yA,OWN)[n-1]),num(fol(S.yB,OWN)[n-1]));
  var netC=chg(q&&q.net,p&&p.net);
  var lbls=MON.slice(0,n);
  var isNet=S.mainMetric==="net";
  var A=[],B=[]; for(var i=0;i<n;i++){ A.push(isNet?netNew(S.yA,OWN,i):growth(S.yA,OWN,i)); B.push(isNet?netNew(S.yB,OWN,i):growth(S.yB,OWN,i)); }
  var fw=wins(function(i){return netNew(S.yA,OWN,i);},function(i){return netNew(S.yB,OWN,i);},n);
  var fchart=barChart({labels:lbls,a:A,b:B,ca:"var(--ya)",cb:"var(--yb)",na:S.yA,nb:S.yB,aria:"Monthly "+(isNet?"new followers":"follower growth")+", "+S.yA+" and "+S.yB,
    fmt:isNet?fi:function(v){return fp(v);}, lab:isNet?short:function(v){return v.toFixed(2)+"%";}, axis:isNet?short:function(v){return v.toFixed(1)+"%";}});

  var ea=eng(S.yA,OWN).slice(0,n).map(num), eb=eng(S.yB,OWN).slice(0,n).map(num);
  var ew=wins(function(i){return ea[i];},function(i){return eb[i];},n);
  var bA=extreme(ea,n,true), bB=extreme(eb,n,true), wA=extreme(ea,n,false), wB=extreme(eb,n,false);
  var echart=barChart({labels:lbls,a:ea,b:eb,ca:"var(--ya)",cb:"var(--yb)",na:S.yA,nb:S.yB,aria:"Monthly engagement rate, "+S.yA+" and "+S.yB,
    fmt:function(v){return fp(v);}, lab:function(v){return v.toFixed(1)+"%";}, axis:function(v){return v.toFixed(0)+"%";}});

  return '<section class="sec" id="main"><div class="sec-h"><h2 class="disp">'+esc(OWN)+'</h2></div>'+
  '<p class="sec-p">The primary channel being monitored, '+esc(S.yB)+' against '+esc(S.yA)+', '+range(n)+'.</p>'+
  '<div class="card" data-card="main-followers"><div class="card-h"><div><h3>Follower growth</h3><p>New followers each month, both years side by side.</p></div>'+
    seg("mainMetric",[["net","New followers"],["pct","Growth rate"]],S.mainMetric)+'</div>'+
    '<div class="kpis">'+
      kpi("Followers at end of "+FULL[n-1],fi(p&&p.end),'<span class="'+cls(yoy)+'">'+fsp(yoy,1)+'</span> vs '+fi(num(fol(S.yA,OWN)[n-1]))+' in '+esc(S.yA))+
      kpi("New followers, "+range(n),fi(p&&p.net),'<span class="'+cls(netC)+'">'+fsp(netC,1)+'</span> vs '+fi(q&&q.net)+' in '+esc(S.yA))+
      kpi("Total growth this period",fp(p&&p.total),fp(q&&q.tiny?"nb":(q&&q.total))+' in '+esc(S.yA))+
      kpi("Average monthly growth",fp(p&&p.avg),fp(q&&q.tiny?"nb":(q&&q.avg))+' in '+esc(S.yA))+
    '</div>'+legendYears()+'<div class="scroll">'+fchart+'</div>'+
    '<div class="callout">'+esc(S.yB)+' added more followers than the same month of '+esc(S.yA)+' in <b>'+fw.w+' of '+fw.t+' months</b>.</div>'+
    '<div class="note"><b>How this is measured.</b> New followers is the change in follower count from the previous month (January is measured from the December before). Growth rate is that change as a percentage of the previous month\'s count. Average monthly growth is the steady monthly rate that takes the page from its December count to its '+FULL[n-1]+' count.</div>'+
  '</div>'+
  '<div class="card" data-card="main-engagement"><div class="card-h"><div><h3>Engagement</h3><p>Monthly engagement rate as reported by the platform, both years side by side.</p></div></div>'+
    '<div class="kpis">'+
      kpi("Months higher than "+esc(S.yA),ew.w+" of "+ew.t,"Same month, year over year")+
      kpi("Best month, "+esc(S.yB),bB?fp(bB.v):"—",bB?"In "+FULL[bB.i]+(bA?" ("+esc(S.yA)+" best: "+fp(bA.v)+" in "+FULL[bA.i]+")":""):"")+
      kpi("Weakest month, "+esc(S.yB),wB?fp(wB.v):"—",wB?"In "+FULL[wB.i]+(wA?" ("+esc(S.yA)+" weakest: "+fp(wA.v)+" in "+FULL[wA.i]+")":""):"")+
    '</div>'+legendYears()+'<div class="scroll">'+echart+'</div>'+
    '<div class="note"><b>Why there\'s no average.</b> Engagement rates are fractions, and months differ in size, so averaging them gives a misleading figure. Each month is shown as reported, and the months-higher count summarises the year without averaging.</div>'+
  '</div></section>';
}

function channelsSection(n){
  var xs=MON.slice(0,n), lines=[];
  var idx=S.trendMode==="index", one=S.trendSel.length===1;
  D.channels.forEach(function(c){
    if(S.trendSel.indexOf(c)<0) return;
    [S.yA,S.yB].forEach(function(y,k){
      var f=fol(y,c).slice(0,n).map(num), j=num(f[0]);
      var v=f.map(function(x){ return x===null?null:(idx?(j?x/j*100:null):x); });
      lines.push({name:c+" "+y,label:one?y:(k?c:""),color:chColor(c),dash:k===0,v:v});
    });
  });
  var chart=lineChart({x:xs,lines:lines,log:!idx,endLabels:S.trendSel.length<=3,
    aria:"Follower trend by channel",fmt:idx?function(v){return v.toFixed(1);}:fi,axis:idx?function(v){return v.toFixed(0);}:short});

  var cum=S.tableMode==="cum";
  var rows=D.channels.map(function(c){
    var p=chPeriod(S.yB,c,n), q=chPeriod(S.yA,c,n);
    var ea=num(fol(S.yA,c)[n-1]), eb=num(fol(S.yB,c)[n-1]), y=chg(ea,eb);
    var na=q&&q.net, nb=p&&p.net, nc=chg(na,nb);
    var ga=q&&(q.tiny?"nb":(cum?q.total:q.avg)), gb=p&&(p.tiny?"nb":(cum?p.total:p.avg));
    return '<tr'+(c===OWN?' class="own"':'')+'><td class="nm"><span class="sw" style="background:'+chColor(c)+'"></span>'+esc(c)+'</td>'+
      '<td>'+fi(ea)+'</td><td>'+fi(eb)+'</td><td class="'+cls(y)+'">'+fsp(y,1)+'</td>'+
      '<td>'+fi(na===null||na===undefined?null:(cum?na:na/n))+'</td><td>'+fi(nb===null||nb===undefined?null:(cum?nb:nb/n))+'</td><td class="'+cls(nc)+'">'+fsp(nc,1)+'</td>'+
      '<td>'+fp(ga,cum?1:2)+'</td><td>'+fp(gb,cum?1:2)+'</td></tr>';
  }).join("");

  var ec=S.engCh, ea=eng(S.yA,ec).slice(0,n).map(num), eb=eng(S.yB,ec).slice(0,n).map(num);
  var echart=barChart({labels:xs,a:ea,b:eb,ca:"var(--ya)",cb:chColor(ec),na:S.yA,nb:S.yB,aria:"Monthly engagement rate for "+ec,
    fmt:function(v){return fp(v);},lab:function(v){return v.toFixed(1)+"%";},axis:function(v){return v.toFixed(0)+"%";}});
  var erows=D.channels.map(function(c){
    var a=eng(S.yA,c).slice(0,n).map(num), b=eng(S.yB,c).slice(0,n).map(num);
    var w=wins(function(i){return a[i];},function(i){return b[i];},n), xa=extreme(a,n,true), xb=extreme(b,n,true);
    return '<tr'+(c===OWN?' class="own"':'')+'><td class="nm"><span class="sw" style="background:'+chColor(c)+'"></span>'+esc(c)+'</td><td>'+w.w+' of '+w.t+'</td>'+
      '<td>'+(xa?fp(xa.v)+' ('+MON[xa.i]+')':'—')+'</td><td>'+(xb?fp(xb.v)+' ('+MON[xb.i]+')':'—')+'</td></tr>';
  }).join("");

  return '<section class="sec" id="channels"><div class="sec-h"><h2 class="disp">All channels</h2></div>'+
  '<p class="sec-p">Every IPASS channel, '+esc(S.yB)+' against '+esc(S.yA)+', '+range(n)+'.</p>'+
  '<div class="card" data-card="channel-trend"><div class="card-h"><div><h3>Follower growth by channel</h3><p>'+(idx?"Each line starts at 100 in January, so channels of very different sizes can be compared directly.":"Actual follower counts on a log scale, so small channels stay visible next to large ones.")+'</p></div>'+
    seg("trendMode",[["index","Indexed (January = 100)"],["log","Log scale"]],S.trendMode)+'</div>'+
    '<div class="chips">'+D.channels.map(function(c){ return '<button class="chip" data-act="trendSel" data-v="'+esc(c)+'" aria-pressed="'+(S.trendSel.indexOf(c)>=0)+'"><span class="dot" style="background:'+chColor(c)+'"></span>'+esc(c)+'</button>'; }).join("")+'</div>'+
    '<div class="legend"><span><i class="ln dash"></i>'+esc(S.yA)+'</span><span><i class="ln"></i>'+esc(S.yB)+'</span></div>'+
    '<div class="scroll">'+chart+'</div>'+
    '<div class="note"><b>Reading the chart.</b> Dashed lines are '+esc(S.yA)+', solid lines are '+esc(S.yB)+'. In the indexed view, a line ending at 110 means that channel grew 10% between January and '+FULL[n-1]+'. Use the channel buttons to narrow the view; with three or fewer selected, each line is labelled, and with one selected you can compare its two years directly.</div>'+
  '</div>'+
  '<div class="card" data-card="channel-table"><div class="card-h"><div><h3>Cumulative and average</h3><p>'+(cum?"Totals for "+range(n)+", same months in both years.":"The same period expressed per month.")+'</p></div>'+
    seg("tableMode",[["cum","Cumulative"],["avg","Average per month"]],S.tableMode)+'</div>'+
    '<div class="scroll"><table><thead><tr><th>Channel</th><th>Followers<br>'+MON[n-1]+' '+esc(S.yA)+'</th><th>Followers<br>'+MON[n-1]+' '+esc(S.yB)+'</th><th>Year over<br>year</th>'+
    '<th>'+(cum?"New followers":"New followers<br>per month")+'<br>'+esc(S.yA)+'</th><th>'+(cum?"New followers":"New followers<br>per month")+'<br>'+esc(S.yB)+'</th><th>Change</th>'+
    '<th>'+(cum?"Total growth":"Average monthly<br>growth")+'<br>'+esc(S.yA)+'</th><th>'+(cum?"Total growth":"Average monthly<br>growth")+'<br>'+esc(S.yB)+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="note"><b>How this is measured.</b> '+(cum
      ?'Cumulative figures run from the December before each year to '+FULL[n-1]+'. New followers is the total gained over those months, and total growth is that gain as a percentage of the December count.'
      :'New followers per month is the cumulative total divided by '+n+' months. Average monthly growth is the steady monthly rate that takes each channel from its December count to its '+FULL[n-1]+' count, so one unusual month can\'t distort it.')+
    ' Growth shows n/a where the starting count was below '+TINY+' followers, because a percentage off a tiny base (such as a newly launched page) is meaningless. Engagement isn\'t included here: its rates are shown month by month in the next card, as agreed, rather than averaged.</div>'+
  '</div>'+
  '<div class="card" data-card="channel-engagement"><div class="card-h"><div><h3>Engagement by channel</h3><p>Each channel compared with itself, month by month.</p></div>'+
    '<select class="sel" data-ch="engCh" aria-label="Channel">'+D.channels.map(function(c){ return '<option'+(c===ec?' selected':'')+'>'+esc(c)+'</option>'; }).join("")+'</select></div>'+
    '<div class="legend"><span><i class="sw" style="background:var(--ya)"></i>'+esc(S.yA)+'</span><span><i class="sw" style="background:'+chColor(ec)+'"></i>'+esc(S.yB)+'</span></div>'+
    '<div class="scroll">'+echart+'</div>'+
    '<div class="scroll" style="margin-top:14px"><table><thead><tr><th>Channel</th><th>Months higher<br>in '+esc(S.yB)+'</th><th>Best month<br>'+esc(S.yA)+'</th><th>Best month<br>'+esc(S.yB)+'</th></tr></thead><tbody>'+erows+'</tbody></table></div>'+
    '<div class="note"><b>Why channels aren\'t ranked.</b> Each platform calculates engagement rate its own way, so a higher rate on one channel doesn\'t mean it outperformed another. What\'s comparable is a channel against its own previous year.</div>'+
  '</div></section>';
}

function competitorSection(n){
  var C=comps();
  var head='<section class="sec" id="competitors"><div class="sec-h"><h2 class="disp">Competitor benchmark</h2></div>';
  if(!C) return head+'<div class="card"><div class="empty">No competitor figures for '+esc(S.yB)+' yet. Add them under Update figures.</div></div></section>';
  var pages=[{name:OWN,start:base(S.yB,OWN),arr:fol(S.yB,OWN)}].concat(C.pages.map(function(p){ return {name:p,start:compBase(S.yB,p),arr:C.followers[p]||[]}; }));
  var m=n; pages.forEach(function(p){ m=Math.min(m,lastIdx(p.arr)+1); });
  if(m<1) return head+'<div class="card"><div class="empty">Competitor figures for '+esc(S.yB)+' are incomplete.</div></div></section>';
  pages.forEach(function(p,i){ p.c="var("+CMPV[i%CMPV.length]+")"; p.r=period(p.start,num(p.arr[m-1]),m); });
  var prevY=String(+S.yB-1);
  var tiles=pages.map(function(p){
    return '<div class="tile" style="border-top-color:'+p.c+'"><div class="n">'+esc(p.name)+'</div>'+
      '<div class="v">'+fp(p.r&&(p.r.tiny?"nb":p.r.avg))+'</div><div class="u">average growth per month</div>'+
      '<div class="d">'+fsp(p.r&&(p.r.tiny?"nb":p.r.total))+' in total, '+fs(p.r&&p.r.net)+' followers</div></div>';
  }).join("");
  var bars=hBars({items:pages.map(function(p){return {name:p.name,v:p.r&&!p.r.tiny?p.r.avg:null,c:p.c};}),aria:"Average monthly audience growth",fmt:function(v){return v.toFixed(2)+"%";}});
  var x=["Dec"].concat(MON.slice(0,m));
  var lines=pages.map(function(p){ var v=[p.start?100:null].concat(p.arr.slice(0,m).map(function(a){ a=num(a); return a===null||!p.start?null:a/p.start*100; })); return {name:p.name,label:p.name,color:p.c,dash:false,v:v}; });
  var line=lineChart({x:x,lines:lines,log:false,endLabels:true,aria:"Indexed follower trend, December = 100",fmt:function(v){return v.toFixed(2);},axis:function(v){return v.toFixed(0);}});
  var rows=pages.map(function(p,i){
    return '<tr'+(i===0?' class="own"':'')+'><td class="nm"><span class="sw" style="background:'+p.c+'"></span>'+esc(p.name)+'</td><td>'+fi(p.start)+'</td><td>'+fi(p.r&&p.r.end)+'</td><td>'+fs(p.r&&p.r.net)+'</td><td>'+fsp(p.r&&(p.r.tiny?"nb":p.r.total))+'</td><td>'+fp(p.r&&(p.r.tiny?"nb":p.r.avg))+'</td></tr>';
  }).join("");
  var ownR=pages[0].r, lead=pages.slice().filter(function(p){return p.r&&typeof p.r.avg==="number";}).sort(function(a,b){return b.r.avg-a.r.avg;});
  var sum=lead.length?lead.map(function(p,i){ return (i===0?"<b>"+esc(p.name)+"</b> grew fastest":esc(p.name)+(i===lead.length-1?" was slowest":" came next"))+" at "+fp(p.r.avg)+" a month"; }).join(", ")+".":"";
  return head+'<p class="sec-p">'+esc(OWN)+' against '+esc(C.pages.join(" and "))+', December '+esc(prevY)+' to '+FULL[m-1]+' '+esc(S.yB)+'.</p>'+
  '<div class="card" data-card="competitor-growth"><div class="card-h"><div><h3>Average audience growth</h3><p>How fast each page\'s followers grew, per month on average.</p></div></div>'+
    '<div class="tiles">'+tiles+'</div><div class="scroll">'+bars+'</div>'+
    (sum?'<div class="callout">'+sum+'</div>':'')+
    '<div class="note"><b>How this is measured.</b> Average growth per month is the steady monthly rate that takes each page from its December '+esc(prevY)+' follower count to its '+FULL[m-1]+' count. Unlike a plain average of monthly percentages, one unusual month can\'t distort it.'+(m<n?' Competitor figures run to '+FULL[m-1]+', so this comparison stops there.':'')+'</div>'+
  '</div>'+
  '<div class="card" data-card="competitor-trend"><div class="card-h"><div><h3>Growth over the year</h3><p>Each page starts at 100 in December, so a line at 105 means 5% more followers than at the start of the year.</p></div></div>'+
    '<div class="scroll">'+line+'</div>'+
    '<div class="scroll" style="margin-top:14px"><table><thead><tr><th>Page</th><th>Followers<br>Dec '+esc(prevY)+'</th><th>Followers<br>'+MON[m-1]+' '+esc(S.yB)+'</th><th>Net new</th><th>Total growth</th><th>Average<br>per month</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '</div></section>';
}

/* ---------- editor (owner only) ---------- */
function linkFor(v){
  var p=["view="+v,"ya="+S.yA,"yb="+S.yB];   // years pinned; months follow the latest data
  var baseUrl=D.siteUrl||D.url||(location.origin+location.pathname);
  return baseUrl+"#"+p.join("&");
}
function editor(){
  var ys=years(), y=E.year, rows=[], hasBase=true, label="";
  if(E.ds==="followers"){ rows=D.channels; label="Followers (December is the count at the end of the previous year)"; }
  else if(E.ds==="engagement"){ rows=D.channels; hasBase=false; label="Engagement rate % as reported by each platform"; }
  else { var C=D.competitors[y]; rows=C?C.pages:[]; label="Competitor followers (December is the count at the end of the previous year)"; }
  function cell(r,col){
    var v;
    if(E.ds==="followers") v=col==="b"?(D.baselines[y]||{})[r]:((D.followers[y]||{})[r]||[])[col];
    else if(E.ds==="engagement") v=((D.engagement[y]||{})[r]||[])[col];
    else { var C=D.competitors[y]||{}; v=col==="b"?(C.baseline||{})[r]:((C.followers||{})[r]||[])[col]; }
    var ph=""; if(col==="b"){ var fb=E.ds==="competitors"?(function(){ var P=D.competitors[String(+y-1)]; return num(P&&P.followers&&P.followers[r]&&P.followers[r][11]); })():num(fol(String(+y-1),r)[11]); if(fb!==null) ph=' placeholder="'+fb+'"'; }
    return '<input class="gcell'+(col==="b"?" base":"")+'"'+ph+' data-row="'+esc(r)+'" data-col="'+col+'" value="'+(v===null||v===undefined?"":esc(v))+'" inputmode="decimal" aria-label="'+esc(r+" "+(col==="b"?"December":MON[col]))+'">';
  }
  var grid='<div class="scroll"><table class="grid"><thead><tr><th></th>'+(hasBase?'<th>Dec</th>':'')+MON.map(function(m){return '<th>'+m+'</th>';}).join("")+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr><td>'+esc(r)+'</td>'+(hasBase?'<td>'+cell(r,"b")+'</td>':'')+MON.map(function(m,i){return '<td>'+cell(r,i)+'</td>';}).join("")+'</tr>'; }).join("")+'</tbody></table></div>';
  var links=["all"].concat(Object.keys(SECTIONS)).map(function(v){
    var u=linkFor(v);
    return '<div class="pick"><div style="min-width:0"><div style="font-weight:600;font-size:12.5px">'+esc(SECTIONS[v]||"Whole report")+'</div><div class="pick-u">'+esc(u)+'</div></div><button class="btn sec" data-act="copy" data-v="'+esc(u)+'">Copy link</button></div>';
  }).join("");
  return '<details class="ed" id="ed"'+(E.open?" open":"")+'><summary>Update figures</summary><div class="edbody">'+
    '<div class="edrow"><div class="grp"><span class="lab">Data</span>'+seg("eds",[["followers","Followers"],["engagement","Engagement"],["competitors","Competitors"]],E.ds)+'</div>'+
    '<div class="grp"><span class="lab">Year</span><select class="sel" data-ch="eyear">'+ys.map(function(v){return '<option'+(v===y?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select></div>'+
    '<button class="btn sec" data-act="addyear">Add '+(+ys[ys.length-1]+1)+'</button></div>'+
    '<p class="sub" style="margin-bottom:10px">'+label+'. Type into a cell, or paste a block from Excel. If the block includes the name column, rows are matched by name.</p>'+grid+
    (E.ds==="competitors"?'<div class="edrow"><input class="tin" id="newcomp" placeholder="Competitor name"><button class="btn sec" data-act="addcomp">Add competitor</button></div>':'')+
    '<div class="grp" style="margin-top:16px"><span class="lab">Data note, shown at the top of the report</span><textarea id="note" placeholder="For example: September figures are still being collected.">'+esc(D.note||"")+'</textarea></div>'+
    '<div class="edrow"><button class="btn" data-act="save"'+(dirty?"":" disabled")+'>Save and publish</button>'+(downloads?'<button class="btn sec" data-act="webexport">Download for website</button>':'')+'</div>'+'<p class="sub" style="margin-top:6px">Notion can\'t display claude.ai pages, so the embeddable copy lives on your website. After publishing changes here, click <b>Download for website</b> and upload the file to the <b>public</b> folder on GitHub, replacing report.html.</p>'+
    '<div class="msg '+(E.ok?"ok":"err")+'" id="msg">'+esc(E.msg||(dirty?"You have unsaved changes. Publish to show them to everyone with the link.":""))+'</div>'+
    '<h3 style="font-size:14px;margin:22px 0 4px">Section links for Notion</h3>'+(D.siteUrl?'':'<p class="sub">Set the website address to get embeddable links.</p>')+'<p class="sub">Each link opens just that part of the report, trimmed to sit cleanly in an embed. The years stay fixed at '+esc(S.yA)+' vs '+esc(S.yB)+'; the months update by themselves as new figures are published.</p>'+links+
  '</div></details>';
}

/* ---------- render ---------- */
function render(){
  clampUpto();
  var n=S.upto, ys=years(), solo=S.view!=="all";
  document.body.classList.toggle("solo",solo);
  var h='';
  if(!solo){
    h+='<header><h1 class="disp">Social media performance, '+esc(S.yA)+' vs '+esc(S.yB)+'</h1><p class="sub">IPASS Processing social channels, '+range(n)+'</p>'+
      '<p class="lede disp">'+headline(n)+'</p></header>'+
      '<div class="controls"><div class="grp"><span class="lab">Compare</span><div style="display:flex;gap:6px;align-items:center">'+
      '<select class="sel" data-ch="yA" aria-label="Earlier year">'+ys.map(function(v){return '<option'+(v===S.yA?' selected':'')+'>'+v+'</option>';}).join("")+'</select><span class="lab">with</span>'+
      '<select class="sel" data-ch="yB" aria-label="Later year">'+ys.map(function(v){return '<option'+(v===S.yB?' selected':'')+'>'+v+'</option>';}).join("")+'</select></div></div>'+
      '<div class="grp"><span class="lab">Months included</span><select class="sel" data-ch="upto" aria-label="Months included">'+
      MON.slice(0,maxUpto()).map(function(m,i){return '<option value="'+(i+1)+'"'+(i+1===n?' selected':'')+'>January to '+FULL[i]+'</option>';}).join("")+'</select></div></div>';
    h+=overview(n)+mainSection(n)+channelsSection(n)+competitorSection(n);
    if(canEdit&&artifact) h+=editor();
  } else {
    var v=S.view, fn=v==="overview"?overview:v.indexOf("main")===0?mainSection:v.indexOf("channel")===0?channelsSection:competitorSection;
    var body=fn(n);
    if(v.indexOf("-")>0){ var tmp=document.createElement("div"); tmp.innerHTML=body; var cd=tmp.querySelector('[data-card="'+v+'"]'); body=cd?cd.outerHTML:body; }
    h+='<header><h1 class="disp" style="font-size:22px">'+esc(SECTIONS[v]||"")+'</h1><p class="sub">'+esc(S.yA)+' vs '+esc(S.yB)+', '+range(n)+'</p></header>'+body;
  }
  app.innerHTML='<div class="wrap">'+h+'</div>';
}

/* ---------- interaction ---------- */
function msg(t,ok){ E.msg=t; E.ok=ok!==false; var m=document.getElementById("msg"); if(m){ m.textContent=t; m.className="msg "+(E.ok?"ok":"err"); } }
function markDirty(){ dirty=true; var b=app.querySelector('[data-act="save"]'); if(b) b.disabled=false; }
function parseNum(s){
  s=String(s==null?"":s).replace(/\s+/g,"").replace(/%$/,"");
  if(s==="") return null;
  if(/^-?\d+,\d{1,2}$/.test(s)) s=s.replace(",",".");   // "1,14" typed as a decimal
  else s=s.replace(/,/g,"");                              // "445,298" thousands separators
  var v=parseFloat(s); return isNaN(v)?null:v;
}
function setCell(row,col,v){
  var y=E.year;
  if(E.ds==="followers"){
    if(col==="b"){ (D.baselines[y]=D.baselines[y]||{})[row]=v; }
    else { var f=(D.followers[y]=D.followers[y]||{}); f[row]=f[row]||new Array(12).fill(null); f[row][col]=v; }
  } else if(E.ds==="engagement"){
    var e=(D.engagement[y]=D.engagement[y]||{}); e[row]=e[row]||new Array(12).fill(null); e[row][col]=v;
  } else {
    var C=D.competitors[y]; if(!C) return;
    if(col==="b") C.baseline[row]=v; else { C.followers[row]=C.followers[row]||new Array(12).fill(null); C.followers[row][col]=v; }
  }
}
function edRows(){ return E.ds==="competitors"?((D.competitors[E.year]||{}).pages||[]):D.channels; }

app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]"); if(!t) return;
  var a=t.getAttribute("data-act"), v=t.getAttribute("data-v");
  if(a==="mainMetric"){ S.mainMetric=v; render(); }
  else if(a==="tableMode"){ S.tableMode=v; render(); }
  else if(a==="trendMode"){ S.trendMode=v; render(); }
  else if(a==="trendSel"){ var i=S.trendSel.indexOf(v); if(i>=0){ if(S.trendSel.length>1) S.trendSel.splice(i,1); } else S.trendSel.push(v); render(); }
  else if(a==="eds"){ E.ds=v; E.msg=""; render(); }
  else if(a==="addyear"){
    var ys=years(), ny=String(+ys[ys.length-1]+1), latest=D.competitors[ys[ys.length-1]];
    D.followers[ny]={}; D.engagement[ny]={}; D.baselines[ny]={};
    D.channels.forEach(function(c){ D.followers[ny][c]=new Array(12).fill(null); D.engagement[ny][c]=new Array(12).fill(null); });
    D.competitors[ny]={pages:latest?latest.pages.slice():[],baseline:{},followers:{}};
    D.competitors[ny].pages.forEach(function(p){ D.competitors[ny].followers[p]=new Array(12).fill(null); });
    E.year=ny; markDirty(); render(); msg("Added "+ny+". Fill in its figures, then publish.",true);
  }
  else if(a==="addcomp"){
    var inp=document.getElementById("newcomp"), name=(inp&&inp.value||"").trim(), C=D.competitors[E.year];
    if(!name) return;
    if(!C) C=D.competitors[E.year]={pages:[],baseline:{},followers:{}};
    if(C.pages.indexOf(name)<0){ C.pages.push(name); C.followers[name]=new Array(12).fill(null); }
    markDirty(); render(); msg("Added "+name+". Fill in its figures, then publish.",true);
  }
  else if(a==="copy"){
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(function(){ t.textContent="Copied"; setTimeout(function(){t.textContent="Copy link";},1400); },function(){ t.textContent="Copy failed"; });
  }
  else if(a==="save"){ publish(); }
  else if(a==="webexport"){
    if(!downloads){ msg("Downloading isn't available in this view.",false); return; }
    downloads.save({filename:"report.html",data:buildDoc()}).then(function(){
      msg("Saved report.html. Upload it to the public folder on GitHub to update the website copy and your Notion embeds.",true);
    }).catch(function(e){
      msg(e&&e.code==="declined"?"Download cancelled.":"Couldn't download: "+((e&&e.message)||"unknown error"),false);
    });
  }
});
app.addEventListener("change",function(e){
  var t=e.target, k=t.getAttribute&&t.getAttribute("data-ch"); if(!k) return;
  if(k==="yA"||k==="yB"){ S[k]=t.value; S.upto=0; render(); }
  else if(k==="upto"){ S.upto=+t.value; render(); }
  else if(k==="engCh"){ S.engCh=t.value; render(); }
  else if(k==="eyear"){ E.year=t.value; E.msg=""; render(); }
});
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.classList.contains("gcell")){ var c=t.getAttribute("data-col"); setCell(t.getAttribute("data-row"),c==="b"?"b":+c,parseNum(t.value)); markDirty(); }
  else if(t.id==="note"){ D.note=t.value.trim(); markDirty(); }
});
app.addEventListener("focusout",function(e){ if(e.target.classList&&e.target.classList.contains("gcell")) render(); });
app.addEventListener("toggle",function(e){ if(e.target.id==="ed") E.open=e.target.open; },true);
app.addEventListener("paste",function(e){
  var t=e.target; if(!t.classList||!t.classList.contains("gcell")) return;
  var text=(e.clipboardData||window.clipboardData).getData("text"); if(!text||(text.indexOf("\t")<0&&text.indexOf("\n")<0)) return;
  e.preventDefault();
  var lines=text.replace(/\r/g,"").split("\n").filter(function(l){return l.trim()!=="";}).map(function(l){return l.split("\t");});
  var rows=edRows(), hasBase=E.ds!=="engagement", cols=(hasBase?["b"]:[]).concat(MON.map(function(m,i){return i;}));
  var startCol=cols.indexOf(t.getAttribute("data-col")==="b"?"b":+t.getAttribute("data-col")), startRow=rows.indexOf(t.getAttribute("data-row"));
  var byName=lines.some(function(l){ return rows.some(function(r){ return r.toLowerCase()===String(l[0]).trim().toLowerCase(); }); });
  var applied=0, skipped=[];
  lines.forEach(function(l,li){
    var row, cells=l;
    if(byName){ var nm=String(l[0]).trim(); row=rows.filter(function(r){return r.toLowerCase()===nm.toLowerCase();})[0]; cells=l.slice(1); if(!row){ if(nm) skipped.push(nm); return; } }
    else row=rows[startRow+li];
    if(!row) return;
    cells.forEach(function(v,ci){ var col=cols[startCol+ci]; if(col===undefined) return; setCell(row,col,parseNum(v)); });
    applied++;
  });
  markDirty(); render();
  msg(applied?"Filled "+applied+" row"+(applied===1?"":"s")+(skipped.length?". Skipped unrecognised: "+skipped.join(", "):"")+". Publish to save.":"Nothing matched. Check the first column of the pasted block.",!!applied);
});
var rz; window.addEventListener("resize",function(){ clearTimeout(rz); rz=setTimeout(function(){ var a=document.activeElement; if(!(a&&a.classList&&a.classList.contains("gcell"))) render(); },150); });

function readHash(){
  var h=(location.hash||"").replace(/^#/,""); if(!h){ S.view="all"; return; }
  h.split("&").forEach(function(kv){ var p=kv.split("="), k=p[0], v=decodeURIComponent(p[1]||"");
    if(k==="view"&&(SECTIONS[v]||v==="all")) S.view=v;
    else if(k==="ya"&&D.followers[v]) S.yA=v;
    else if(k==="yb"&&D.followers[v]) S.yB=v;
    else if(k==="upto"&&+v>=1&&+v<=12) S.upto=+v; });
}

function buildDoc(){
  var style=document.getElementById("app-style").textContent;
  var code=document.getElementById("app-code").textContent;
  var seed=JSON.stringify(D).replace(/</g,"\\u003c");
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
    '<title>Social Media Performance Report</title>\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=Inter:wght@400;500;550;600;650&display=swap" rel="stylesheet">\n'+
    '<style id="app-style">'+style+'</style>\n</head>\n<body>\n<script id="seed" type="application/json">'+seed+'<\/script>\n'+
    '<div id="app"></div>\n<script id="app-code">'+code+'<\/script>\n</body>\n</html>';
}
function publish(){
  if(!artifact){ msg("Publishing isn't available in this view.",false); return; }
  var b=app.querySelector('[data-act="save"]'); if(b) b.disabled=true;
  msg("Publishing…",true);
  artifact.publish(buildDoc()).then(function(){ dirty=false; msg("Published. Everyone with the link now sees these figures.",true); })
  .catch(function(e){ if(b) b.disabled=false;
    msg(e&&e.code==="conflict"?"Someone else published first. This view will reload to their version, so re-enter these figures afterwards.":"Couldn't publish: "+((e&&e.message)||"unknown error"),false); });
}

readHash(); render();
window.addEventListener("hashchange",function(){ readHash(); render(); });
if(window.claude&&claude.use){
  claude.use("user").then(function(u){ canEdit=u?u.canEdit():false; return claude.use("artifact"); })
  .then(function(a){ artifact=a; return claude.use("downloads"); })
  .then(function(dl){ downloads=dl; if(canEdit&&artifact) render(); }).catch(function(){ if(canEdit&&artifact) render(); });
}
})();
</script>
</body>
</html>
